<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>TDEM LPI · Golden Key Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #faf8f5;
    --bg-elev: #ffffff;
    --fg: #1a1825;
    --fg-soft: #3a3850;
    --muted: #6b6880;
    --muted-light: #9b98ad;
    --primary: #7c3aed;
    --primary-dark: #6d28d9;
    --primary-soft: rgba(124, 58, 237, 0.08);
    --primary-border: rgba(124, 58, 237, 0.2);
    --orange: #ea580c;
    --orange-soft: rgba(234, 88, 12, 0.08);
    --orange-border: rgba(234, 88, 12, 0.25);
    --green: #16a34a;
    --green-soft: rgba(22, 163, 74, 0.08);
    --green-border: rgba(22, 163, 74, 0.25);
    --red: #dc2626;
    --amber: #ca8a04;
    --border: rgba(26, 24, 37, 0.08);
    --border-strong: rgba(26, 24, 37, 0.16);
    --card: rgba(255, 255, 255, 0.7);
    --card-elev: rgba(255, 255, 255, 0.85);
    --card-solid: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-weight: 400;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, button { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: var(--muted-light); }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  a { color: var(--primary); }

  /* ===== Animations ===== */
  @keyframes grid-scroll {
    from { background-position: 0 0; }
    to { background-position: 40px 40px; }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .grid-base, .grid-spotlight { animation: none; }
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ===== Backdrop ===== */
  .grid-base, .grid-spotlight, .orb-layer {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }
  .grid-base {
    opacity: 0.5;
    background-image:
      linear-gradient(to right, rgba(26, 24, 37, 0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(26, 24, 37, 0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: grid-scroll 4s linear infinite;
  }
  .grid-spotlight {
    opacity: 0.85;
    background-image:
      linear-gradient(to right, rgba(124, 58, 237, 0.25) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(124, 58, 237, 0.25) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: grid-scroll 4s linear infinite;
    -webkit-mask-image: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%), black, transparent);
    mask-image: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%), black, transparent);
  }
  .orb-layer { overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(120px); }
  .orb-1 { right: -20%; top: -20%; width: 50%; height: 50%; background: rgba(249, 115, 22, 0.18); }
  .orb-2 { right: 5%; top: -10%; width: 25%; height: 25%; background: rgba(124, 58, 237, 0.2); }
  .orb-3 { left: -15%; bottom: -25%; width: 50%; height: 50%; background: rgba(37, 99, 235, 0.15); }
  .orb-4 { left: 30%; top: 60%; width: 30%; height: 30%; background: rgba(236, 72, 153, 0.1); }

  /* ===== Layout ===== */
  #app { position: relative; z-index: 10; min-height: 100vh; }
  .container { max-width: 760px; margin: 0 auto; padding: 0 1.5rem; }
  .container-wide { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
  .center-screen {
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 1.5rem; min-height: calc(100vh - 70px);
  }

  /* ===== Action bar ===== */
  .action-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(250, 248, 245, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem;
  }
  .action-bar .brand { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
  .action-bar .org {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--primary); font-weight: 600;
  }
  .action-bar .title {
    font-size: 0.88rem; font-weight: 600; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .action-bar .sub {
    font-size: 0.75rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .action-bar .right {
    font-size: 0.78rem; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em;
  }
  .action-bar .right a { cursor: pointer; color: var(--primary); font-weight: 500; text-decoration: none; }

  /* ===== Cards ===== */
  .card {
    background: var(--card);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 12px rgba(26, 24, 37, 0.04);
  }
  .card-elev {
    background: var(--card-elev);
  }

  /* ===== Buttons ===== */
  .btn {
    padding: 0.7rem 1.4rem; border-radius: 8px; border: none;
    cursor: pointer; font-size: 0.9rem; font-weight: 600;
    transition: all 0.15s; letter-spacing: 0.01em;
  }
  .btn-small { padding: 0.5rem 1rem; font-size: 0.78rem; }
  .btn-primary {
    background: var(--primary); color: white;
    box-shadow: 0 2px 10px rgba(124, 58, 237, 0.2);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--primary-dark);
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
  }
  .btn-green {
    background: var(--green); color: white;
    box-shadow: 0 2px 10px rgba(22, 163, 74, 0.2);
  }
  .btn-ghost {
    background: transparent; color: var(--fg-soft);
    border: 1px solid var(--border-strong);
  }
  .btn-ghost:hover:not(:disabled) {
    background: var(--primary-soft); border-color: var(--primary-border);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-full { width: 100%; }

  /* ===== Form inputs ===== */
  .input, .textarea {
    width: 100%; padding: 0.65rem 0.9rem;
    border: 1.5px solid var(--border-strong);
    border-radius: 8px; font-size: 0.9rem;
    background: var(--card-solid); color: var(--fg);
    outline: none; transition: border-color 0.2s;
  }
  .input:focus, .textarea:focus { border-color: var(--primary); }
  .textarea { resize: vertical; line-height: 1.65; padding: 0.85rem 1rem; }

  .label {
    display: block; font-size: 0.65rem; color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 600; margin-bottom: 0.3rem;
  }

  /* ===== Badges & pills ===== */
  .section-label {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: var(--primary);
    background: var(--primary-soft);
    border: 1px solid var(--primary-border);
    padding: 0.35rem 0.75rem; border-radius: 4px;
    letter-spacing: 0.1em; font-weight: 600;
    text-transform: uppercase; margin-bottom: 0.85rem;
  }
  .section-label.amber { color: var(--orange); background: var(--orange-soft); border-color: var(--orange-border); }
  .section-label.green { color: var(--green); background: var(--green-soft); border-color: var(--green-border); }

  .pill {
    display: inline-block;
    padding: 0.2rem 0.6rem; border-radius: 4px;
    background: var(--primary-soft);
    border: 1px solid var(--primary-border);
    color: var(--primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .pill.green { background: var(--green-soft); border-color: var(--green-border); color: var(--green); }
  .pill.amber { background: var(--orange-soft); border-color: var(--orange-border); color: var(--orange); }

  /* ===== Headings ===== */
  h1, h2, h3 { font-family: 'Libre Baskerville', Georgia, serif; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.1; }
  h2 { font-size: 1.6rem; line-height: 1.2; }
  h3 { font-size: 1.3rem; line-height: 1.25; }

  /* ===== Hero card ===== */
  .hero-card {
    position: relative; padding: 3rem 2.5rem;
    text-align: center; overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(124, 58, 237, 0.06);
  }
  .hero-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--primary), var(--orange), transparent);
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 1rem; background: var(--primary-soft);
    border: 1px solid var(--primary-border);
    border-radius: 999px; margin-bottom: 1.5rem;
  }
  .hero-tag .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 10px rgba(124, 58, 237, 0.6);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  .hero-tag span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--primary); font-weight: 600;
  }
  .hero-sub {
    font-size: 0.95rem; color: var(--muted);
    line-height: 1.65; margin: 0.85rem auto 2rem;
    max-width: 420px;
  }

  /* ===== Helper boxes ===== */
  .info-box {
    padding: 1rem 1.25rem;
    background: var(--primary-soft);
    border: 1px solid var(--primary-border);
    border-left: 3px solid var(--primary);
    border-radius: 8px;
  }
  .info-box.amber {
    background: var(--orange-soft);
    border-color: var(--orange-border);
    border-left-color: var(--orange);
  }
  .info-box .info-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; color: var(--primary);
    font-weight: 600; margin-bottom: 0.4rem;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .info-box.amber .info-label { color: var(--orange); }
  .info-box p { font-size: 0.88rem; color: var(--fg); line-height: 1.65; }

  /* ===== Survey-specific ===== */
  .domain-tabs {
    display: flex; gap: 0.4rem;
    margin-bottom: 1.25rem; flex-wrap: wrap;
  }
  .domain-tab {
    padding: 0.45rem 0.95rem; border-radius: 999px;
    border: 1.5px solid var(--border); cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; font-weight: 600;
    background: var(--card-solid); color: var(--fg-soft);
    transition: all 0.15s; letter-spacing: 0.04em;
  }
  .domain-tab.done {
    border-color: var(--green-border); background: var(--green-soft); color: var(--green);
  }
  .domain-tab.active {
    border-color: var(--primary); background: var(--primary); color: white;
  }
  .domain-tab.open-q {
    border-color: var(--orange); background: var(--orange-soft); color: var(--orange);
  }
  .domain-tab.open-q.active {
    background: var(--orange); color: white;
  }

  .item-row { padding: 1rem 0; border-bottom: 1px solid var(--border); }
  .item-row:last-child { border-bottom: none; }
  .item-text {
    font-size: 0.95rem; color: var(--fg); line-height: 1.6; margin-bottom: 0.85rem;
  }
  .item-text .id {
    color: var(--muted-light); font-size: 0.72rem; margin-right: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
  }

  .scale-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .scale-btn {
    padding: 0.5rem 0.9rem; border-radius: 6px;
    border: 1.5px solid var(--border); cursor: pointer;
    font-size: 0.82rem; background: var(--card-solid);
    color: var(--fg-soft); font-weight: 500; transition: all 0.1s;
  }
  .scale-btn.active {
    border-color: var(--primary); background: var(--primary); color: white; font-weight: 600;
  }

  .progress-track {
    height: 3px; background: rgba(124, 58, 237, 0.1);
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--orange));
    transition: width 0.4s ease;
  }

  /* ===== Depth textarea (open questions) ===== */
  .dt-example {
    margin-bottom: 0.75rem; padding: 0.85rem 1.1rem;
    background: var(--primary-soft);
    border-radius: 8px; border-left: 3px solid var(--primary);
  }
  .dt-example .lbl {
    font-size: 0.7rem; color: var(--primary);
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.12em;
  }
  .dt-example .quote {
    font-size: 0.85rem; color: var(--fg);
    line-height: 1.6; font-style: italic;
  }
  .dt-example .note {
    font-size: 0.72rem; color: var(--muted); margin-top: 0.5rem;
  }
  .dt-status {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 0.4rem;
  }
  .dt-status .msg {
    font-size: 0.72rem; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
  }
  .dt-status .msg.short { color: var(--orange); }
  .dt-status .msg.good { color: var(--green); }
  .dt-status .count {
    font-size: 0.7rem; color: var(--muted-light);
    font-family: 'JetBrains Mono', monospace;
  }
  .dt-followup {
    margin-top: 0.75rem; padding: 0.85rem 1.1rem;
    background: var(--orange-soft); border-radius: 8px;
    border: 1px solid var(--orange-border);
    display: flex; align-items: flex-start; gap: 0.75rem;
    animation: fade-in 0.3s ease-out;
  }
  .dt-followup .lbl {
    font-size: 0.78rem; color: var(--orange);
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .dt-followup .body {
    font-size: 0.85rem; color: var(--fg); line-height: 1.6;
  }
  .dt-followup .close {
    background: none; border: none; cursor: pointer;
    color: var(--muted-light); font-size: 1.1rem;
    flex-shrink: 0; padding: 0; line-height: 1;
  }
  .textarea.dt-strong { border-color: var(--green); border-width: 2px; }
  .textarea.dt-short { border-color: var(--orange); border-width: 2px; }

  /* ===== Admin sidebar ===== */
  .admin-layout {
    display: flex; min-height: calc(100vh - 70px);
  }
  .admin-sidebar {
    width: 270px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-right: 1px solid var(--border);
    padding: 1.25rem; flex-shrink: 0;
    display: flex; flex-direction: column;
  }
  .admin-main { flex: 1; padding: 1.75rem; overflow: auto; }
  .admin-sidebar-label {
    font-size: 0.7rem; color: var(--primary);
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 0.85rem;
  }
  .participant-btn {
    width: 100%; padding: 0.65rem 0.85rem;
    border: 1px solid transparent; border-radius: 8px;
    cursor: pointer; background: transparent;
    color: var(--fg); font-size: 0.88rem; font-weight: 500;
    text-align: left; margin-bottom: 0.3rem;
    transition: all 0.15s;
  }
  .participant-btn.active {
    border-color: var(--primary-border);
    background: var(--primary-soft);
    color: var(--primary); font-weight: 600;
  }

  /* Admin tabs */
  .tab-row { display: flex; flex-wrap: wrap; gap: 0; }
  .tab-btn {
    padding: 0.7rem 1.1rem; border: none; cursor: pointer;
    font-size: 0.82rem; font-weight: 600;
    background: transparent; color: var(--muted);
    transition: all 0.15s;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active {
    background: var(--card-elev);
    color: var(--primary);
    border-bottom-color: var(--primary);
    border-top: 1px solid var(--border);
  }
  .tab-content {
    border-radius: 0 12px 12px 12px;
  }

  /* ===== Reports ===== */
  .report-header {
    border-radius: 10px; padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem; position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 4px 20px rgba(124, 58, 237, 0.2);
  }
  .report-header.facil {
    background: linear-gradient(135deg, var(--primary-dark), #4c1d95);
  }
  .report-header::after {
    content: ''; position: absolute; top: -50px; right: -50px;
    width: 200px; height: 200px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
  }
  .report-header .eyebrow {
    font-size: 0.7rem; color: rgba(255,255,255,0.7);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 0.4rem; font-weight: 600;
  }
  .report-header .name {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 1.4rem; color: white; font-weight: 700;
  }
  .report-header .meta {
    font-size: 0.78rem; color: rgba(255,255,255,0.7); margin-top: 0.2rem;
  }

  /* Toast */
  .toast {
    position: fixed; top: 5rem; left: 50%;
    transform: translateX(-50%); z-index: 100;
    padding: 0.75rem 1.25rem;
    background: var(--green); color: white;
    border-radius: 8px;
    font-size: 0.9rem; font-weight: 500;
    box-shadow: 0 4px 20px rgba(22, 163, 74, 0.3);
    animation: fade-in 0.2s ease-out;
  }

  /* Code block */
  code {
    font-size: 0.72rem;
    background: var(--card-solid);
    border: 1px solid var(--border);
    padding: 0.45rem 0.65rem;
    border-radius: 4px;
    display: block; margin-top: 0.6rem;
    word-break: break-all;
    font-family: 'JetBrains Mono', monospace;
    color: var(--fg-soft);
  }

  /* Mobile */
  @media (max-width: 720px) {
    .admin-layout { flex-direction: column; }
    .admin-sidebar { width: 100%; }
    .hero-card { padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>

<!-- Animated backdrop -->
<div class="orb-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>
<div class="grid-base"></div>
<div class="grid-spotlight" id="spotlight"></div>

<div id="app"></div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// TDEM LPI · Single-file static app
// ════════════════════════════════════════════════════════════════════════════

// ── Mouse spotlight ─────────────────────────────────────────────────────────
document.addEventListener("mousemove", (e) => {
  document.documentElement.style.setProperty("--mx", e.clientX + "px");
  document.documentElement.style.setProperty("--my", e.clientY + "px");
});

// ── Constants ───────────────────────────────────────────────────────────────
const SCALE = ["Never", "Rarely", "Sometimes", "Often", "Consistently"];
const DOMAINS = [
  "Decision-Making Under Pressure",
  "Self-Management Under Pressure",
  "Team Leadership & Enabling Others",
  "Strategic Focus & Cross-Boundary Influence",
  "Resilience & Sustainable Leadership",
];
const DOMAIN_NOTES = [
  null,
  null,
  "During a fast-moving incident, some of this may not show up the way it would on a blue-sky day. When time is short and a situation is escalating, directive, get-it-done leadership is often the right call, and there may not be room for coaching or handholding in the moment. Rate the pattern you see across both operational and blue-sky periods, not just the most urgent moments.",
  null,
  null,
];
const ITEMS = [
  { id: 1, d: 0, text: "Stays calm and thinks clearly when information is incomplete or the situation is rapidly changing." },
  { id: 2, d: 0, text: "Recognizes when a situation needs people to change how they work together, not just a technical fix." },
  { id: 3, d: 0, text: "Makes timely decisions without waiting for perfect information, then adjusts as new information becomes available." },
  { id: 4, d: 0, text: "Makes decisions in a way that reflects clear principles, even when the situation is ambiguous or pressured." },
  { id: 5, d: 1, text: "When under stress, adjusts in ways that help them respond rather than react." },
  { id: 6, d: 1, text: "Maintains composure in high-pressure situations in a way that helps - not hinders - the people around them." },
  { id: 7, d: 1, text: "Adjusts their communication approach based on who they are talking with and what the situation requires." },

// ── Database (Supabase via REST API) ────────────────────────────────────────
// All reads/writes go through Supabase. Each function returns a Promise.
// Errors are surfaced via console + a toast so the user knows something went wrong.

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Accept": "application/json",
      "Prefer": "return=representation",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const text = await res.text();
    console.error(`Supabase error ${res.status} on ${path}:`, text);
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

const DB = {
  // PARTICIPANTS
  async listParticipants() {
    const rows = await sbFetch("participants?select=*&order=created_at.desc");
    // Convert array to map keyed by id (matches the old localStorage shape)
    const out = {};
    (rows || []).forEach(r => {
      out[r.id] = { id: r.id, name: r.name, updatedAt: r.created_at };
    });
    return out;
  },
  async addParticipant(pid, name) {
    await sbFetch("participants", {
      method: "POST",
      body: JSON.stringify({ id: pid, name }),
    });
  },
  async upsertParticipant(pid, name) {
    // Used by survey submission to ensure participant exists
    await sbFetch("participants?on_conflict=id", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
      body: JSON.stringify({ id: pid, name }),
    });
  },

  // NOMINATIONS
  async getNominations(pid) {
    const rows = await sbFetch(`nominations?participant_id=eq.${encodeURIComponent(pid)}&select=*`);
    if (!rows || rows.length === 0) return {};
    const r = rows[0];
    return {
      ...r.data,
      status: r.status,
      submittedAt: r.submitted_at,
      approvedAt: r.approved_at,
    };
  },
  async saveNominations(pid, dataObj) {
    // Upsert
    const payload = {
      participant_id: pid,
      data: {
        participantId: dataObj.participantId,
        participantName: dataObj.participantName,
        selfEmail: dataObj.selfEmail,
        nominations: dataObj.nominations,
      },
      status: dataObj.status || "pending",
      submitted_at: dataObj.submittedAt || new Date().toISOString(),
    };
    await sbFetch("nominations?on_conflict=participant_id", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
      body: JSON.stringify(payload),
    });
  },
  async approveNominations(pid) {
    await sbFetch(`nominations?participant_id=eq.${encodeURIComponent(pid)}`, {
      method: "PATCH",
      body: JSON.stringify({ status: "approved", approved_at: new Date().toISOString() }),
    });
  },

  // RESPONSES
  async getResponses(pid) {
    const rows = await sbFetch(`responses?participant_id=eq.${encodeURIComponent(pid)}&select=*&order=submitted_at.asc`);
    return (rows || []).map(r => ({
      id: r.id,
      participantId: r.participant_id,
      raterGroup: r.rater_group,
      ratings: r.ratings,
      openQ: r.open_q,
      submittedAt: r.submitted_at,
    }));
  },
  async addResponse(submission) {
    await sbFetch("responses", {
      method: "POST",
      body: JSON.stringify({
        id: submission.id,
        participant_id: submission.participantId,
        rater_group: submission.raterGroup,
        ratings: submission.ratings,
        open_q: submission.openQ,
      }),
    });
  },

  // BACKUP/RESTORE
  async exportAll() {
    const [participants, nominations, responses] = await Promise.all([
      sbFetch("participants?select=*"),
      sbFetch("nominations?select=*"),
      sbFetch("responses?select=*"),
    ]);
    return {
      exportedAt: new Date().toISOString(),
      participants: participants || [],
      nominations: nominations || [],
      responses: responses || [],
    };
  },
};

function parseHash() {
  const h = window.location.hash.slice(1);
  if (!h) return { route: "/", params: {} };
  const [path, search = ""] = h.split("?");
  const params = {};
  new URLSearchParams(search).forEach((v, k) => (params[k] = v));
  return { route: path || "/", params };
}

function depthTextareaHTML(qKey, placeholder, example, followUp) {
  const val = surveyState.openQ[qKey];
  const tooShort = val.length > 0 && val.length < MIN_CHARS;
  const good = val.length >= MIN_CHARS;
  return `
    ${example ? `
      <div class="dt-example">
        <div class="lbl">Example of useful feedback</div>
        <div class="quote">"${esc(example)}"</div>
        <div class="note">Notice: specific situation, observable behavior, named impact.</div>
      </div>` : ""}
    <textarea class="textarea ${good ? "dt-strong" : tooShort ? "dt-short" : ""}"
      data-qkey="${qKey}"
      data-followup="${esc(followUp || "What specifically did you observe? What was the situation, and what was the impact?")}"
      rows="5" placeholder="${esc(placeholder)}">${esc(val)}</textarea>
    <div class="dt-status">
      <div class="msg ${good ? "good" : tooShort ? "short" : ""}" id="msg-${qKey}">
        ${val.length === 0 ? "" : tooShort ? "A bit more context would help; aim for a specific situation" : good ? "✓ Good level of detail" : ""}
      </div>
      <div class="count" id="count-${qKey}">${val.length} chars</div>
    </div>
    <div id="followup-${qKey}"></div>
  `;
}

const followupTimers = {};
const followupShown = {};
const followupDismissed = {};

function wireDepthTextareas() {
  $$(".textarea[data-qkey]").forEach(ta => {
    ta.addEventListener("input", () => {
      const qKey = ta.dataset.qkey;
      const val = ta.value;
      surveyState.openQ[qKey] = val;
      const tooShort = val.length > 0 && val.length < MIN_CHARS;
      const good = val.length >= MIN_CHARS;

      ta.classList.toggle("dt-strong", good);
      ta.classList.toggle("dt-short", tooShort);

      const msgEl = $("#msg-" + qKey);
      msgEl.className = "msg " + (good ? "good" : tooShort ? "short" : "");
      msgEl.textContent = val.length === 0 ? "" : tooShort
        ? "A bit more context would help; aim for a specific situation"
        : good ? "✓ Good level of detail" : "";

      $("#count-" + qKey).textContent = val.length + " chars";

      // Update submit button state
      const openValid = surveyState.openQ.q1.length >= MIN_CHARS && surveyState.openQ.q2.length >= MIN_CHARS;
      const submitBtn = $$(".btn.btn-primary").find(b => b.textContent.includes("Submit") || b.textContent.includes("more detail"));
      if (submitBtn) {
        submitBtn.disabled = !openValid || surveyState.submitting;
        submitBtn.textContent = !openValid ? "Add more detail to continue" : "Submit Feedback";
      }

      // Follow-up scheduling
      clearTimeout(followupTimers[qKey]);
      if (val.length > 20 && val.length < MIN_CHARS && !followupDismissed[qKey]) {
        followupTimers[qKey] = setTimeout(() => showFollowup(qKey, ta.dataset.followup), 2500);
      } else if (val.length >= MIN_CHARS) {
        hideFollowup(qKey);
      }
    });
  });
}

function showFollowup(qKey, followUpText) {
  if (followupShown[qKey] || followupDismissed[qKey]) return;
  followupShown[qKey] = true;
  const container = $("#followup-" + qKey);
  if (!container) return;
  container.innerHTML = `
    <div class="dt-followup">
      <div style="flex: 1;">
        <div class="lbl">Can you add a bit more?</div>
        <div class="body">${esc(followUpText)}</div>
      </div>
      <button class="close" onclick="dismissFollowup('${qKey}')" aria-label="Dismiss">×</button>
    </div>
  `;
}

function hideFollowup(qKey) {
  followupShown[qKey] = false;
  const container = $("#followup-" + qKey);
  if (container) container.innerHTML = "";
}

function dismissFollowup(qKey) {
  followupDismissed[qKey] = true;
  hideFollowup(qKey);
}

async function submitSurvey() {
  if (surveyState.submitting) return;
  surveyState.submitting = true;
  renderSurvey(); // re-render to show "Submitting..."

  const submission = {
    id: uid(),
    submittedAt: new Date().toISOString(),
    participantId: surveyState.participantId,
    participantName: surveyState.participantName,
    raterGroup: surveyState.raterGroup,
    ratings: surveyState.ratings,
    openQ: surveyState.openQ,
  };

  try {
    // Ensure participant exists (FK constraint)
    await DB.upsertParticipant(surveyState.participantId, surveyState.participantName);
    await DB.addResponse(submission);
    surveyState.page = "thanks";
  } catch (e) {
    showError("Could not submit. Please check your internet and try again.");
  }

  surveyState.submitting = false;
  renderSurvey();
}

async function addParticipant() {
  const name = $("#new-participant").value.trim();
  if (!name) return;
  const pid = uid();
  try {
    await DB.addParticipant(pid, name);
    adminState.participants[pid] = { name, id: pid, updatedAt: new Date().toISOString() };
    $("#new-participant").value = "";
    renderAdmin();

async function exportData() {
  try {
    const data = await DB.exportAll();
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `tdem-lpi-backup-${new Date().toISOString().split("T")[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  } catch (e) {
    showError("Export failed.");
  }
}

function buildSummary() {
  const p = adminState.participants[adminState.selectedPid];
  let s = `PARTICIPANT: ${p?.name}\n\n=== FREQUENCY RATINGS ===\n\n`;
  ITEMS.forEach(item => {
    s += `Item ${item.id} [${DOMAINS[item.d]}]: ${item.text}\n`;
    RATER_GROUPS.forEach(group => {
      const gr = adminState.responses.filter(r => r.raterGroup === group);
      if (gr.length) {
        const vals = gr.map(r => r.ratings[item.id]).filter(v => v !== undefined);
        const a = avg(vals);
        s += `  ${group} (n=${gr.length}): ${a !== null ? SCALE[Math.round(a)] + ` (avg ${a.toFixed(1)})` : "No response"}\n`;
      }
    });
    s += "\n";
  });
  s += "\n=== OPEN QUESTIONS ===\n\n";
  ["q1", "q2", "q3"].forEach((q, qi) => {
    s += `Q${qi + 1}:\n`;
    adminState.responses.forEach(r => {
      if (r.openQ[q]) s += `[${r.raterGroup}]: ${r.openQ[q]}\n`;
    });
    s += "\n";
  });
  return s;
}

          </div>
          <div style="font-size: 0.65rem; color: var(--muted-light); font-family: 'JetBrains Mono', monospace; margin-top: 0.5rem; line-height: 1.5;">
            Data is stored in Supabase. Refresh to see new submissions.
          </div>
        </div>
      </div>

      <!-- Main pane -->
      <div class="admin-main">
        ${!a.selectedPid ? `
          <div style="text-align: center; padding: 5rem 0; color: var(--muted);">
            <div style="font-size: 2.2rem; margin-bottom: 0.85rem; opacity: 0.3;">⟵</div>
            <div style="font-size: 1rem;">Select a participant</div>
          </div>
        ` : `
          <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.85rem;">
            <div>
              <h2 style="font-size: 1.7rem;">${esc(selected.name)}</h2>
              <div style="display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap;">
                ${groupCounts.filter(g => g.count > 0).map(g => `<span class="pill">${esc(g.group)}: ${g.count}</span>`).join("")}
                ${a.nominations.status ? `<span class="pill ${a.nominations.status === "approved" ? "green" : "amber"}">Nominations: ${esc(a.nominations.status)}</span>` : ""}
              </div>
            </div>
            <button class="btn btn-ghost btn-small" onclick="refreshSelected()">↻ Refresh</button>
          </div>

          <div class="tab-row">
            ${[
              { key: "nominations", label: "Nominations" },
              { key: "responses", label: "Responses" },
              { key: "report", label: "Report" },
              { key: "facilitator", label: "Facilitator Brief" },
            ].map((t, i, arr) => `
              <button class="tab-btn ${a.activeTab === t.key ? "active" : ""}"
                onclick="setTab('${t.key}')"
                style="border-radius: ${i === 0 ? "10px 0 0 0" : i === arr.length - 1 ? "0 10px 0 0" : "0"};">
                ${esc(t.label)}
              </button>
            `).join("")}
          </div>

          <div class="card tab-content">
            ${renderAdminTab()}
          </div>
        `}
      </div>
    </div>
  `;

  // Wire up edit-on-input for report/facilPrep textareas (so typing persists in state)
  const reportTa = $("#report-textarea");
  if (reportTa) reportTa.addEventListener("input", e => { adminState.report = e.target.value; });
  const prepTa = $("#prep-textarea");
  if (prepTa) prepTa.addEventListener("input", e => { adminState.facilPrep = e.target.value; });
}

function renderAdminTab() {
  const a = adminState;
  const selected = a.participants[a.selectedPid];

  if (a.activeTab === "nominations") {
    if (Object.keys(a.nominations).length === 0) {
      return `
        <div style="text-align: center; padding: 2.5rem 1rem;">
          <p style="font-size: 0.92rem; color: var(--fg-soft); margin-bottom: 1rem;">No nominations submitted yet for ${esc(selected.name)}.</p>
          <div class="info-box" style="text-align: left;">
            <div class="info-label">Participant nomination link</div>
            <p>Send this link to ${esc(selected.name)} to nominate their raters:</p>
            <code>${esc(nominateLink(a.selectedPid, selected.name))}</code>
            <button class="btn btn-ghost btn-small" style="margin-top: 0.5rem;"
              onclick="copyToClipboard('${nominateLink(a.selectedPid, selected.name).replace(/'/g, "\\'")}', 'Link copied')">
              Copy link
            </button>
          </div>
        </div>
      `;
    }

    return `
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.5rem;">
        <div>
          <div style="font-size: 0.95rem; color: var(--fg); font-weight: 600; margin-bottom: 0.2rem;">Rater nominations from ${esc(selected.name)}</div>
          <div style="font-size: 0.78rem; color: var(--muted); font-family: 'JetBrains Mono', monospace;">
            Submitted ${a.nominations.submittedAt ? new Date(a.nominations.submittedAt).toLocaleDateString() : ""}
          </div>
        </div>
        ${a.nominations.status === "pending" ? `<button class="btn btn-green btn-small" onclick="approveNominations()">Approve & Release Links</button>` : ""}
        ${a.nominations.status === "approved" ? `<span style="font-size: 0.82rem; color: var(--green); font-weight: 600; font-family: 'JetBrains Mono', monospace;">✓ Approved ${a.nominations.approvedAt ? new Date(a.nominations.approvedAt).toLocaleDateString() : ""}</span>` : ""}
      </div>

      ${a.nominations.selfEmail ? `
        <div style="padding: 0.85rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.75rem;">
          <div style="font-size: 0.7rem; color: var(--primary); font-family: 'JetBrains Mono', monospace; font-weight: 600; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.1em;">Self-Assessment</div>
          <div style="font-size: 0.88rem; color: var(--fg);">${esc(a.nominations.selfEmail)}</div>
        </div>
      ` : ""}

      ${Object.entries(a.nominations.nominations || {}).map(([group, raters]) => {
        const named = raters.filter(r => r.name);
        if (named.length === 0) return "";
        return `
          <div style="margin-bottom: 1.25rem;">
            <div class="section-label">${esc(group)}</div>
            ${named.map(r => `
              <div style="padding: 0.85rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem;">
                <div style="font-size: 0.9rem; font-weight: 600; color: var(--fg);">${esc(r.name)}</div>
                <div style="font-size: 0.82rem; color: var(--muted); margin-top: 0.15rem;">${esc(r.email)}</div>
                ${r.note ? `<div style="font-size: 0.82rem; color: var(--fg-soft); margin-top: 0.5rem; font-style: italic;">"${esc(r.note)}"</div>` : ""}
                ${a.nominations.status === "approved" ? `
                  <div style="margin-top: 0.6rem; padding: 0.5rem 0.7rem; background: var(--card-solid); border: 1px solid var(--green-border); border-radius: 6px;">
                    <div style="font-size: 0.7rem; color: var(--green); font-family: 'JetBrains Mono', monospace; font-weight: 600; margin-bottom: 0.25rem; letter-spacing: 0.08em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;">
                      <span>Survey link</span>
                      <button onclick="copyToClipboard('${surveyLink(a.selectedPid, selected.name, group).replace(/'/g, "\\'")}', 'Survey link copied')"
                        style="background: none; border: none; color: var(--green); cursor: pointer; font-size: 0.7rem; font-weight: 600;">Copy</button>
                    </div>
                    <code style="display: block;">${esc(surveyLink(a.selectedPid, selected.name, group))}</code>
                  </div>
                ` : ""}
              </div>
            `).join("")}
          </div>
        `;
      }).join("")}

      ${a.nominations.status === "pending" ? `
        <div class="info-box amber" style="margin-top: 0.6rem;">
          <div class="info-label">GKG Review Checklist</div>
          ${[
            "Does the list include at least one person from above, alongside, and below?",
            "Are there at least 4 total raters to protect anonymity?",
            "Does the list look too safe: all close collaborators, no one who might offer a challenging perspective?",
            "If any rater group has only 1 person, is that group's data reportable?",
          ].map(q => `
            <div style="display: flex; gap: 0.6rem; font-size: 0.85rem; color: var(--fg); margin-bottom: 0.4rem; line-height: 1.5;">
              <span style="color: var(--orange); flex-shrink: 0;">☐</span>${esc(q)}
            </div>
          `).join("")}
        </div>
      ` : ""}
    `;
  }

  if (a.activeTab === "responses") {
    if (a.responses.length === 0) {
      return `
        <div style="text-align: center; padding: 2.5rem 1rem; color: var(--muted);">
          <div style="font-size: 0.92rem; margin-bottom: 0.6rem;">No responses yet.</div>
          <div style="font-size: 0.82rem; color: var(--muted-light);">Approve nominations first, then send survey links to raters.</div>
        </div>
      `;
    }

    let html = "";
    DOMAINS.forEach((domain, dIdx) => {
      html += `<div style="margin-bottom: 1.75rem;"><div class="section-label">${esc(domain)}</div>`;
      ITEMS.filter(i => i.d === dIdx).forEach(item => {
        html += `<div style="padding: 0.85rem 0; border-bottom: 1px solid var(--border);">
          <div style="font-size: 0.88rem; color: var(--fg); margin-bottom: 0.6rem; line-height: 1.55;">
            <span style="color: var(--muted-light); font-size: 0.72rem; margin-right: 0.5rem; font-family: 'JetBrains Mono', monospace;">#${item.id}</span>${esc(item.text)}
          </div>
          <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">`;
        RATER_GROUPS.forEach(group => {
          const gr = a.responses.filter(r => r.raterGroup === group);
          if (!gr.length) return;
          const vals = gr.map(r => r.ratings[item.id]).filter(v => v !== undefined);
          const av = avg(vals);
          if (av === null) return;
          const fc = av >= 3 ? "var(--green)" : av >= 2 ? "var(--amber)" : "var(--orange)";
          const bg = av >= 3 ? "var(--green-soft)" : av >= 2 ? "rgba(202, 138, 4, 0.08)" : "var(--orange-soft)";
          const bd = av >= 3 ? "var(--green-border)" : av >= 2 ? "rgba(202, 138, 4, 0.25)" : "var(--orange-border)";
          html += `<div style="padding: 0.3rem 0.65rem; border-radius: 6px; background: ${bg}; border: 1px solid ${bd}; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;">
            <span style="color: var(--muted);">${esc(group)}: </span>
            <strong style="color: ${fc};">${esc(SCALE[Math.round(av)])}</strong>
            <span style="color: var(--muted-light);"> (${av.toFixed(1)})</span>
          </div>`;
        });
        html += "</div></div>";
      });
      html += "</div>";
    });

    html += `<div style="margin-top: 1rem;"><div class="section-label">Open Responses</div>`;
    ["q1", "q2", "q3"].forEach((q, qi) => {
      const isAmber = qi === 2;
      const bg = isAmber ? "var(--orange-soft)" : "var(--primary-soft)";
      const bd = isAmber ? "var(--orange-border)" : "var(--primary-border)";
      const fc = isAmber ? "var(--orange)" : "var(--primary)";
      const labels = ["Leadership at its best", "What could be different", "Conditions & constraints"];
      html += `<div style="margin-bottom: 1rem; padding: 1rem 1.25rem; background: ${bg}; border: 1px solid ${bd}; border-radius: 8px;">
        <div style="font-size: 0.7rem; color: ${fc}; font-family: 'JetBrains Mono', monospace; font-weight: 600; margin-bottom: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;">${esc(labels[qi])}</div>`;
      const filled = a.responses.filter(r => r.openQ[q]);
      if (filled.length === 0) {
        html += `<div style="font-size: 0.82rem; color: var(--muted-light); font-style: italic;">No responses</div>`;
      } else {
        filled.forEach(r => {
          html += `<div style="font-size: 0.88rem; color: var(--fg); margin-bottom: 0.6rem; padding-left: 0.85rem; border-left: 2px solid ${bd}; line-height: 1.6;">
            <span style="font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 0.2rem; font-family: 'JetBrains Mono', monospace;">[${esc(r.raterGroup)}]</span>
            ${esc(r.openQ[q])}
          </div>`;
        });
      }
      html += "</div>";
    });
    html += "</div>";
    return html;
  }

  if (a.activeTab === "report") {
    return `
      <div class="report-header">
        <div class="eyebrow">Leadership Feedback Report · GKG Draft</div>
        <div class="name">${esc(selected.name)}</div>
        <div class="meta">${new Date().toLocaleDateString()}</div>
      </div>

      ${a.responses.length === 0 ? `
        <div style="text-align: center; padding: 2rem 1rem; color: var(--muted);">
          <p style="font-size: 0.9rem;">No responses yet; nothing to report on.</p>
        </div>
      ` : `
        <div class="info-box" style="margin-bottom: 1rem;">
          <div class="info-label">Generate report draft</div>
          <p>This static deployment doesn't call an AI directly. Click below to copy the full report prompt, including the rater data, to your clipboard. Paste it into Claude or ChatGPT, review the output, then paste the draft back into the box below.</p>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.85rem;">
            <button class="btn btn-primary btn-small" onclick="copyReportPrompt()">Copy report prompt</button>
            <button class="btn btn-ghost btn-small" onclick="copyRawSummary()">Copy raw data only</button>
          </div>
        </div>

        <textarea id="report-textarea" class="textarea" rows="16"
          placeholder="Paste the AI-generated draft here. You can edit freely before saving."
          style="margin-bottom: 1rem;">${esc(a.report)}</textarea>

        <div class="info-box amber" style="margin-bottom: 0.75rem;">
          <div class="info-label">Before sending</div>
          <p>Review for accuracy and tone. First draft; review for accuracy and tone before sharing.</p>
        </div>

        ${a.report ? `
          <button class="btn btn-ghost btn-full" onclick="copyToClipboard(adminState.report, 'Report copied')">Copy Report to Clipboard</button>
        ` : ""}

        <div style="font-size: 0.7rem; color: var(--muted-light); text-align: center; margin-top: 0.85rem; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em;">
          TDEM LPI · © Golden Key Group · Developmental use only
        </div>
      `}
    `;
  }

  if (a.activeTab === "facilitator") {
    return `
      <div class="report-header facil">
        <div class="eyebrow">Facilitator Only · GKG Confidential</div>
        <div class="name">${esc(selected.name)} · Feedback Conversation Prep</div>
        <div class="meta">60 minutes · 90 if participant requests</div>
      </div>

      ${a.responses.length === 0 ? `
        <div style="text-align: center; padding: 2rem 1rem; color: var(--muted);">
          <p style="font-size: 0.9rem;">No responses yet.</p>
        </div>
      ` : `
        <div class="info-box" style="margin-bottom: 1rem;">
          <p>Copy the facilitator-prep prompt, paste it into Claude or ChatGPT, then paste the brief back here.</p>
          <div style="margin-top: 0.85rem;"><button class="btn btn-primary btn-small" onclick="copyPrepPrompt()">Copy facilitator prompt</button></div>
        </div>

        <textarea id="prep-textarea" class="textarea" rows="10"
          placeholder="Paste the AI-generated facilitator brief here..."
          style="margin-bottom: 1.25rem;">${esc(a.facilPrep)}</textarea>

        <div class="info-box">
          <div class="info-label">60-Minute Session Guide</div>
          ${[
            ["0:00–0:08", "Opening", "'What was it like to read the report?' Listen only."],
            ["0:08–0:20", "Strengths", "What consistently shows up. What resonates. What might be underused."],
            ["0:20–0:38", "Patterns", "Where perspectives differ. Curiosity not analysis."],
            ["0:38–0:50", "Conditions", "Section 5 gets its own time."],
            ["0:50–1:00", "Commitment", "One specific behavior. 90-day horizon."],
            ["+ 30 opt.", "Extension", "If participant requests. Go deeper not broader."],
          ].map(([t, p, n], i, arr) => `
            <div style="display: flex; gap: 0.85rem; padding: 0.65rem 0; ${i < arr.length - 1 ? "border-bottom: 1px solid var(--border);" : ""} ${i === arr.length - 1 ? "opacity: 0.65;" : ""}">
              <div style="width: 80px; font-size: 0.72rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; padding-top: 0.15rem; flex-shrink: 0; font-weight: 500;">${esc(t)}</div>
              <div style="width: 90px; font-size: 0.85rem; color: var(--primary); font-weight: 700; flex-shrink: 0;">${esc(p)}</div>
              <div style="font-size: 0.85rem; color: var(--fg); line-height: 1.55;">${esc(n)}</div>
            </div>
          `).join("")}
        </div>

        ${a.facilPrep ? `
          <button class="btn btn-ghost btn-full" style="margin-top: 0.85rem;" onclick="copyToClipboard(adminState.facilPrep, 'Brief copied')">Copy Brief to Clipboard</button>
        ` : ""}
      `}
    `;
  }

  return "";
}

// ════════════════════════════════════════════════════════════════════════════
// ROUTER
// ════════════════════════════════════════════════════════════════════════════
function render() {
  const { route, params } = parseHash();

  if (route === "/nominate") {
    viewNominate(params.name || "Participant", params.pid || "unknown", false);
  } else if (route === "/survey") {
    viewSurvey(params.name || "Participant", params.pid || "unknown", params.rgroup || "", false);
  } else if (route === "/admin") {
    viewAdmin();
  } else if (route === "/preview-survey") {
    viewSurvey("Alex Rivera (Demo)", "demo001", "", true);
  } else if (route === "/preview-nominate") {
    viewNominate("Alex Rivera (Demo)", "demo001", true);
  } else {
    viewLanding();
  }
}

render();
</script>
</body>
</html>
